services:
  redis:
    image: redis:8.10.2
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    # Import tracked realm JSON on first boot (realm absent). Recreate the
    # container to re-import after editing docker/keycloak/pre-ets-realm.json.
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./docker/keycloak/pre-ets-realm.json:/opt/keycloak/data/import/pre-ets-realm.json:ro
    environment:
      # Required. Set in the shell or a gitignored root `.env` (no committed defaults).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Set KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set KC_BOOTSTRAP_ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    image: postgres:18.6
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pre_ets}
      POSTGRES_USER: ${POSTGRES_USER:-pre_ets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

  flyway:
    image: redgate/flyway:13.9.0
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./packages/backend/migrations:/flyway/migrations:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pre_ets}
      FLYWAY_USER: ${POSTGRES_USER:-pre_ets}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
      FLYWAY_CONNECT_RETRIES: "60"
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"

volumes:
  postgres_data:
