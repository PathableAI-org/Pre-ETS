installed:
  - assess
  - bdd
  - critique
  - git
settings:
  auto_execute_hooks: true
hooks:
  after_plan:
    - extension: critique
      command: speckit.critique.run
      enabled: true
      optional: true
      priority: 10
      prompt: Run spec critique before proceeding to tasks?
      description: Challenges the spec and plan through product and engineering lenses
      condition: null
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 10
      prompt: Commit plan changes?
      description: Auto-commit after implementation planning
      condition: null
  after_specify:
    - extension: bdd
      command: speckit.bdd.scenarios
      enabled: true
      optional: true
      priority: 10
      prompt: Generate Gherkin acceptance scenarios from the spec before planning?
      description: Converts acceptance criteria into Gherkin feature files immediately
        after spec is written
      condition: null
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 10
      prompt: Commit specification changes?
      description: Auto-commit after specification
      condition: null
  before_implement:
    - extension: bdd
      command: speckit.bdd.scaffold
      enabled: true
      optional: true
      priority: 10
      prompt: Scaffold step definition stubs before starting implementation?
      description: Creates step definition stubs so acceptance tests run (and fail)
        before any code is written
      condition: null
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 10
      prompt: Commit outstanding changes before implementation?
      description: Auto-commit before implementation
      condition: null
  before_constitution:
    - extension: git
      command: speckit.git.initialize
      enabled: true
      optional: false
      priority: 10
      prompt: Execute speckit.git.initialize?
      description: Initialize Git repository before constitution setup
      condition: null
  before_specify:
    - extension: git
      command: speckit.git.feature
      enabled: true
      optional: false
      priority: 10
      prompt: Execute speckit.git.feature?
      description: Create feature branch before specification
      condition: null
  before_clarify:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 10
      prompt: Commit outstanding changes before clarification?
      description: Auto-commit before spec clarification
      condition: null
  before_plan:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 10
      prompt: Commit outstanding changes before planning?
      description: Auto-commit before implementation planning
      condition: null
  before_tasks:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 10
      prompt: Commit outstanding changes before task generation?
      description: Auto-commit before task generation
      condition: null
  before_checklist:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 10
      prompt: Commit outstanding changes before checklist?
      description: Auto-commit before checklist generation
      condition: null
  before_analyze:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 10
      prompt: Commit outstanding changes before analysis?
      description: Auto-commit before analysis
      condition: null
  before_taskstoissues:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 10
      prompt: Commit outstanding changes before issue sync?
      description: Auto-commit before tasks-to-issues conversion
      condition: null
  after_constitution:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 10
      prompt: Commit constitution changes?
      description: Auto-commit after constitution update
      condition: null
  after_clarify:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 10
      prompt: Commit clarification changes?
      description: Auto-commit after spec clarification
      condition: null
  after_tasks:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 10
      prompt: Commit task changes?
      description: Auto-commit after task generation
      condition: null
  after_implement:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 10
      prompt: Commit implementation changes?
      description: Auto-commit after implementation
      condition: null
  after_checklist:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 10
      prompt: Commit checklist changes?
      description: Auto-commit after checklist generation
      condition: null
  after_analyze:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 10
      prompt: Commit analysis results?
      description: Auto-commit after analysis
      condition: null
  after_taskstoissues:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 10
      prompt: Commit after syncing issues?
      description: Auto-commit after tasks-to-issues conversion
      condition: null
