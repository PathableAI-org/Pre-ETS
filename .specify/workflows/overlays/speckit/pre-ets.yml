id: "pre-ets"
extends: "speckit"
priority: 5
enabled: true
edits:
  - insert_after: specify
    step:
      id: clarify
      command: speckit.clarify
      integration: "{{ inputs.integration }}"
      input:
        args: "{{ inputs.spec }}"

  - replace: review-spec
    step:
      id: review-spec
      type: gate
      message: "Review spec.md, verification.md, and any authority findings before planning."
      options: [approve, reject]
      on_reject: abort

  - replace: review-plan
    step:
      id: review-plan
      type: gate
      message: "Review the phased plan, contracts/modules.md, and quickstart.md verification mapping before generating tasks."
      options: [approve, reject]
      on_reject: abort
