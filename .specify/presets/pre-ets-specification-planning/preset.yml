schema_version: "1.0"

preset:
  id: "pre-ets-specification-planning"
  name: "Pre-ETS Specification and Planning"
  version: "1.0.1"
  description: "Makes delivery issues authoritative Spec Kit inputs and adds feature verification plus consumer-inward module contract planning."
  author: "PathableAI"
  repository: "https://github.com/PathableAI-org/Pre-ETS"
  license: "MIT"

requires:
  speckit_version: ">=1.2.3"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Ground specification in one authorized delivery issue and produce feature verification design"
      strategy: "wrap"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Clarify behavioral contracts without crossing requirement or delivery authority boundaries"
      strategy: "wrap"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Plan module architecture, public types, contract evidence, then internal implementation"
      strategy: "wrap"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Generate tasks from approved feature verification and module contracts"
      strategy: "wrap"
    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      description: "Resolve the constitution scaffold with the preset-aware Python runtime"
      strategy: "wrap"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "Resolve checklist templates with the preset-aware Python runtime"
      strategy: "wrap"
    - type: "template"
      name: "spec-template"
      file: "templates/spec-addendum.md"
      description: "Add delivery authority and traceability to feature specifications"
      strategy: "append"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-addendum.md"
      description: "Add explicit phased engineering design sections to implementation plans"
      strategy: "append"
    - type: "template"
      name: "verification-template"
      file: "templates/verification-template.md"
      description: "Feature-level automated, manual, and operational verification design"
      strategy: "replace"
    - type: "template"
      name: "modules-contract-template"
      file: "templates/modules-contract-template.md"
      description: "Consumer-inward module architecture, public signatures, error ownership, and evidence design"
      strategy: "replace"

tags:
  - "pre-ets"
  - "requirements"
  - "verification"
  - "architecture"
  - "typescript"
