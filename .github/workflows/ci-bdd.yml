name: CI BDD

# E8 / T033: CI runs @contract/@http without a live Keycloak service. Browser
# provider-arrival (@browser) for OIDC requires local Compose Keycloak via
# `pnpm test:bdd:oidc` until Keycloak is explicitly added to this workflow.
# Path filters already cover packages/frontend/src/** (includes lib/oidc + proxy).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  CI: "true"
  HUSKY: "0"

concurrency:
  group: ci-bdd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect BDD paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bdd: ${{ steps.set.outputs.bdd }}
    steps:
      - name: Detect pull request path changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            bdd:
              - 'features/**'
              - 'tests/bdd/**'
              - 'cucumber.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'packages/frontend/src/**'
              - 'compose.yaml'
      - name: Set path filter outputs
        id: set
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "bdd=true" >> "$GITHUB_OUTPUT"
          else
            echo "bdd=${{ steps.filter.outputs.bdd }}" >> "$GITHUB_OUTPUT"
          fi

  bdd-dry:
    name: CI / BDD Dry
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip when no BDD-relevant paths changed
        if: needs.changes.outputs.bdd != 'true'
        run: echo "No BDD-relevant paths changed; skipping."
      - name: Check out repository
        if: needs.changes.outputs.bdd == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js and install dependencies
        if: needs.changes.outputs.bdd == 'true'
        uses: ./.github/actions/setup-node-pnpm
      - name: Dry-run Cucumber discovery
        if: needs.changes.outputs.bdd == 'true'
        run: pnpm test:bdd:dry

  bdd:
    name: CI / BDD
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci:bdd'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:8.10.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-pnpm
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Configure session environment
        run: |
          echo "REDIS_URL=redis://127.0.0.1:6379" >> "$GITHUB_ENV"
          echo "SESSION_SIGNING_SECRET=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')" >> "$GITHUB_ENV"
          echo "SESSION_TTL_SECONDS=86400" >> "$GITHUB_ENV"
          echo "SESSION_STORE_TIMEOUT_MS=2000" >> "$GITHUB_ENV"
          echo "SESSION_KEY_PREFIX=ci:bdd:${{ github.run_id }}:" >> "$GITHUB_ENV"
          echo "OIDC_TX_KEY_PREFIX=ci:bdd:oidc-tx:${{ github.run_id }}:" >> "$GITHUB_ENV"
      - name: Run production-first Cucumber partitions
        # No live Keycloak in CI (E8). OIDC @http/@contract scenarios that do not
        # require provider-page arrival may run via the main partition; @browser
        # IdP arrival remains local until Keycloak is added here.
        run: pnpm test:bdd
      - name: Run session contract partition
        run: pnpm test:bdd:session:contract
