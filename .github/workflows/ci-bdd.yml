name: Nightly BDD

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  HUSKY: "0"

concurrency:
  group: ci-bdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bdd:
    name: CI / BDD
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:8.10.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-pnpm
      - name: Configure session environment
        run: |
          {
            echo "REDIS_URL=redis://127.0.0.1:6379"
            echo "SESSION_SIGNING_SECRET=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
            echo "SESSION_TTL_SECONDS=86400"
            echo "SESSION_STORE_TIMEOUT_MS=2000"
            echo "SESSION_KEY_PREFIX=ci:bdd:${{ github.run_id }}:"
            echo "OIDC_TX_KEY_PREFIX=ci:bdd:oidc-tx:${{ github.run_id }}:"
          } >> "$GITHUB_ENV"
      - name: Install Chromium for browser and harness checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Run harness checks
        run: pnpm test:bdd:checks
      - name: Build frontend
        id: build
        run: pnpm --filter @pathableai/pre-ets-frontend build
      - name: Start local identity provider
        id: provider
        run: |
          docker run --detach --name "pre-ets-bdd-keycloak-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --publish 127.0.0.1:8080:8080 \
            --volume "$GITHUB_WORKSPACE/docker/keycloak/pre-ets-realm.json:/opt/keycloak/data/import/pre-ets-realm.json:ro" \
            quay.io/keycloak/keycloak:26.8.1 start-dev --import-realm
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:8080/realms/pre-ets/.well-known/openid-configuration >/dev/null; then
              exit 0
            fi
            echo "Waiting for realm discovery (${attempt}/60)"
            sleep 2
          done
          docker logs "pre-ets-bdd-keycloak-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          exit 1
      - name: Run requirements BDD
        run: pnpm exec cucumber-js --config cucumber.mjs
      - name: Smoke check production on-site preview
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:bdd:smoke
      - name: Identity provider failure diagnostics
        if: ${{ failure() && steps.provider.outcome != 'skipped' }}
        run: docker logs "pre-ets-bdd-keycloak-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Remove owned identity provider
        if: ${{ always() && steps.provider.outcome != 'skipped' }}
        run: docker rm --force "pre-ets-bdd-keycloak-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Preserve BDD reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bdd-runtime
          path: reports/cucumber-*.json
          if-no-files-found: ignore
