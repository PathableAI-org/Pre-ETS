name: CI BDD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  CI: "true"
  HUSKY: "0"

concurrency:
  group: ci-bdd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect BDD paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bdd: ${{ steps.set.outputs.bdd }}
    steps:
      - name: Detect pull request path changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            bdd:
              - 'features/**'
              - 'tests/bdd/**'
              - 'cucumber.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'packages/frontend/**'
              - '.github/workflows/ci-bdd.yml'
              - '.github/actions/setup-node-pnpm/**'
              - 'pnpm-workspace.yaml'
              - '.node-version'
              - 'tsconfig*.json'
              - 'compose.yaml'
      - name: Set path filter outputs
        id: set
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "bdd=true" >> "$GITHUB_OUTPUT"
          else
            echo "bdd=${{ steps.filter.outputs.bdd }}" >> "$GITHUB_OUTPUT"
          fi

  bdd-dry:
    name: CI / BDD Dry
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip when no BDD-relevant paths changed
        if: needs.changes.outputs.bdd != 'true'
        run: echo "No BDD-relevant paths changed; skipping."
      - name: Check out repository
        if: needs.changes.outputs.bdd == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js and install dependencies
        if: needs.changes.outputs.bdd == 'true'
        uses: ./.github/actions/setup-node-pnpm
      - name: Dry-run Cucumber discovery
        if: needs.changes.outputs.bdd == 'true'
        run: pnpm test:bdd:dry
      - name: Preserve discovery report
        if: always() && needs.changes.outputs.bdd == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bdd-discovery
          path: reports/cucumber-discovery.json
          if-no-files-found: ignore

  bdd:
    name: CI / BDD
    needs: changes
    if: needs.changes.outputs.bdd == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:8.10.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-pnpm
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Configure session environment
        run: |
          echo "REDIS_URL=redis://127.0.0.1:6379" >> "$GITHUB_ENV"
          echo "SESSION_SIGNING_SECRET=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')" >> "$GITHUB_ENV"
          echo "SESSION_TTL_SECONDS=86400" >> "$GITHUB_ENV"
          echo "SESSION_STORE_TIMEOUT_MS=2000" >> "$GITHUB_ENV"
          echo "SESSION_KEY_PREFIX=ci:bdd:${{ github.run_id }}:" >> "$GITHUB_ENV"
          echo "OIDC_TX_KEY_PREFIX=ci:bdd:oidc-tx:${{ github.run_id }}:" >> "$GITHUB_ENV"
      - name: Build frontend for production scenarios
        run: pnpm --filter @pathableai/pre-ets-frontend build
      - name: Check discovery and presentation guards
        run: pnpm test:bdd:checks
      - name: Run all capability partitions
        # The runner continues independent partitions and returns failure if any failed.
        run: pnpm test:bdd
      - name: Preserve BDD reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bdd-runtime
          path: reports/cucumber-*.json
          if-no-files-found: ignore
