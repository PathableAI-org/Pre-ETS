name: CI Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  CI: "true"
  HUSKY: "0"

concurrency:
  group: ci-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect build paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.set.outputs.build }}
    steps:
      - name: Detect pull request path changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            build:
              - 'packages/**'
              - 'tests/bdd/smoke/**'
              - 'tests/bdd/steps/**'
              - 'tests/bdd/support/**'
              - 'fixtures/tenant-config/**'
              - 'cucumber.mjs'
              - 'cucumber.smoke.mjs'
              - '.github/workflows/ci-build.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.node-version'
              - '.npmrc'
      - name: Set path filter outputs
        id: set
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=${{ steps.filter.outputs.build }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: CI / Build
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip when no build-relevant paths changed
        if: needs.changes.outputs.build != 'true'
        run: echo "No build-relevant paths changed; skipping."
      - name: Check out repository
        if: needs.changes.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js and install dependencies
        if: needs.changes.outputs.build == 'true'
        uses: ./.github/actions/setup-node-pnpm
      - name: Build workspaces
        if: needs.changes.outputs.build == 'true'
        run: pnpm build
      - name: Test backend HTTP server
        if: needs.changes.outputs.build == 'true'
        run: pnpm --filter @pathableai/pre-ets-backend test
      - name: Smoke check production on-site preview
        if: needs.changes.outputs.build == 'true'
        run: pnpm test:bdd:smoke
      - name: Smoke check backend
        if: needs.changes.outputs.build == 'true'
        run: |
          BACKEND_PORT=3002 node packages/backend/dist/main.js &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true; wait "$backend_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if test "$(curl --fail --silent http://127.0.0.1:3002/healthz)" = "ok"; then
              exit 0
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              echo "Backend exited before becoming healthy"
              exit 1
            fi
            sleep 1
          done
          echo "Backend did not become healthy"
          exit 1
