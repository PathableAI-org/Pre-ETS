packages:
  - "packages/*"

# One reviewed Effect dependency set shared by every importer.
catalogs:
  effect:
    "@effect/opentelemetry": "4.0.2"
    "@effect/platform-node": "4.0.2"
    "@effect/vitest": "4.0.2"
    effect: "4.0.2"

# This published range admits incompatible shared-platform peer requirements.
# Restrict the Node parent to its matching published implementation.
overrides:
  "@effect/platform-node@4.0.2>@effect/platform-node-shared": "4.0.2"

# Enforce the same one-day cooldown locally and in CI.
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
strictPeerDependencies: true
saveExact: true

# dprint installs its platform-specific formatter executable.
allowBuilds:
  # Gherkin lint dependencies need no lifecycle build (notice/CLI setup only).
  core-js: false
  protobufjs: false
  dprint: true

minimumReleaseAgeExclude:
  - "@fallow-cli/darwin-arm64@3.33.1"
  - "@fallow-cli/darwin-x64@3.33.1"
  - "@fallow-cli/linux-arm64-gnu@3.33.1"
  - "@fallow-cli/linux-arm64-musl@3.33.1"
  - "@fallow-cli/linux-x64-gnu@3.33.1"
  - "@fallow-cli/linux-x64-musl@3.33.1"
  - "@fallow-cli/win32-arm64-msvc@3.33.1"
  - "@fallow-cli/win32-x64-msvc@3.33.1"
  - "fallow-type-aware@3.33.1"
  - "fallow@3.33.1"
  - "prettier@3.9.10"
