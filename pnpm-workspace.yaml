packages:
  - "packages/*"

# dprint installs its platform-specific formatter executable.
allowBuilds:
  dprint: true
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - "@types/node@24.13.5 || 24.13.6"
  - "@pathableai/react@0.3.0"
  - "@pathableai/styles@0.2.0"
  - eslint@10.11.0
  - "@typescript-eslint/eslint-plugin@8.70.1"
  - "@typescript-eslint/parser@8.70.1"
  - "@typescript-eslint/project-service@8.70.1"
  - "@typescript-eslint/scope-manager@8.70.1"
  - "@typescript-eslint/tsconfig-utils@8.70.1"
  - "@typescript-eslint/type-utils@8.70.1"
  - "@typescript-eslint/types@8.70.1"
  - "@typescript-eslint/typescript-estree@8.70.1"
  - "@typescript-eslint/utils@8.70.1"
  - "@typescript-eslint/visitor-keys@8.70.1"
  - typescript-eslint@8.70.1
  - "@dprint/json@0.25.0 || 0.25.1"
  - "@effect/platform-node-shared@4.0.0-rc.118"
  - "@effect/platform-node@4.0.0-rc.118"
  - effect@4.0.0-rc.118
  - "@effect/vitest@4.0.0-rc.118"
  - "@next/env@16.3.8"
  - "@next/eslint-plugin-next@16.3.8"
  - "@next/swc-darwin-arm64@16.3.8"
  - "@next/swc-darwin-x64@16.3.8"
  - "@next/swc-linux-arm64-gnu@16.3.8"
  - "@next/swc-linux-arm64-musl@16.3.8"
  - "@next/swc-linux-x64-gnu@16.3.8"
  - "@next/swc-linux-x64-musl@16.3.8"
  - "@next/swc-win32-arm64-msvc@16.3.8"
  - "@next/swc-win32-x64-msvc@16.3.8"
  - next@16.3.8
