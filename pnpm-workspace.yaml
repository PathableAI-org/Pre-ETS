packages:
  - "packages/*"

# One reviewed Effect dependency set shared by every importer.
catalogs:
  effect:
    "@effect/opentelemetry": "4.1.2"
    "@effect/platform-node": "4.1.2"
    "@effect/vitest": "4.1.2"
    effect: "4.1.2"

  # Every @opentelemetry/* version, server and browser, inside the @effect/opentelemetry
  # peer ranges, so each package resolves to one deduplicated version.
  opentelemetry:
    "@opentelemetry/api": "1.9.1"
    "@opentelemetry/api-logs": "0.223.0"
    "@opentelemetry/exporter-logs-otlp-proto": "0.223.0"
    "@opentelemetry/exporter-metrics-otlp-proto": "0.223.0"
    "@opentelemetry/exporter-trace-otlp-http": "0.223.0"
    "@opentelemetry/exporter-trace-otlp-proto": "0.223.0"
    "@opentelemetry/instrumentation": "0.223.0"
    "@opentelemetry/instrumentation-document-load": "0.68.0"
    "@opentelemetry/instrumentation-fetch": "0.223.0"
    "@opentelemetry/instrumentation-http": "0.223.0"
    "@opentelemetry/instrumentation-redis": "0.36.0"
    "@opentelemetry/instrumentation-runtime-node": "0.36.0"
    "@opentelemetry/resources": "2.12.0"
    "@opentelemetry/sdk-logs": "0.223.0"
    "@opentelemetry/sdk-metrics": "2.12.0"
    "@opentelemetry/sdk-node": "0.223.0"
    "@opentelemetry/sdk-trace-base": "2.12.0"
    "@opentelemetry/sdk-trace-node": "2.12.0"
    "@opentelemetry/sdk-trace-web": "2.12.0"
    "@opentelemetry/semantic-conventions": "1.43.0"

# This published range admits incompatible shared-platform peer requirements.
# Restrict the Node parent to its matching published implementation.
overrides:
  "@effect/platform-node>@effect/platform-node-shared": "4.1.2"

# Enforce the same one-day cooldown locally and in CI.
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
strictPeerDependencies: true
saveExact: true

# dprint installs its platform-specific formatter executable.
allowBuilds:
  # Gherkin lint dependencies need no lifecycle build (notice/CLI setup only).
  core-js: false
  protobufjs: false
  dprint: true

minimumReleaseAgeExclude:
  - "prettier@3.9.10"
